# Builds Tsundoku on GitHub's Windows machines and publishes it.
# - Pushing a version tag (v0.1.0, matching "version" in tsundoku/package.json and tsundoku/Cargo.toml) checks, builds and publishes a GitHub release with the installer and the updater's latest.json, signed with the key in the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets, and .github/release-notes.md as its text.
# - Push the tag on its own, after the commit: pushed together with the branch that first added this file, it started no run.
# - Running it by hand (Actions > Release > Run workflow) checks and builds without publishing or signing: the installer is kept with the run, to try a build.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tsundoku/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tsundoku

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content tsundoku/package.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path tsundoku/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($cargoVersion -ne $version) {
            throw "tsundoku/Cargo.toml has version $cargoVersion but package.json has ${version}: bump both together."
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag $env:GITHUB_REF_NAME doesn't match the version $version in tsundoku/package.json."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install the UI's packages
        working-directory: tsundoku
        run: npm ci

      - name: Check formatting, lint and test
        shell: cmd
        run: Scripts\Check.cmd

      # The Rust tests rewrite src/bindings from the Rust types; they must match what's committed.
      - name: Check the TypeScript bindings are committed
        shell: pwsh
        run: |
          # Each exit code is read right away: a pwsh step only fails on its last command's.
          git diff --exit-code -- tsundoku/src/bindings
          $changed = $LASTEXITCODE -ne 0
          $untracked = git ls-files --others --exclude-standard -- tsundoku/src/bindings
          if ($changed -or $untracked) { throw "The bindings differ from what's committed: commit the regenerated ones. $untracked" }

      # The updater's latest.json takes its notes from tauri-action's releaseBody: this version's CHANGELOG section, which
      # the app's update banner shows under What's New. Without one, the notes are empty and the banner links to the
      # release's page instead. The release page's own text is .github/release-notes.md, set after the build.
      - name: Read this version's changes
        if: github.event_name == 'push'
        id: changes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [Array]::FindIndex([string[]] $lines, [Predicate[string]] { param($line) $line -match "^## $([regex]::Escape($version))(\s|$)" })
          $notes = ''
          if ($start -lt 0) {
            "::warning::CHANGELOG.md has no section for $version, so the update banner will only link to the release."
          } else {
            $section = foreach ($line in $lines[($start + 1)..($lines.Count - 1)]) {
              if ($line -match '^## ') { break }
              $line
            }
            $notes = ($section -join "`n").Trim()
          }
          $delimiter = "CHANGES_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "notes<<$delimiter", $notes, $delimiter

      # Not pre-releases, even for 0.x: the updater reads releases/latest, which skips pre-releases.
      - name: Build and publish the release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tsundoku
          tagName: ${{ github.ref_name }}
          releaseName: Tsundoku ${{ steps.version.outputs.version }}
          releaseBody: ${{ steps.changes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json

      # tauri-action takes the release's text only as a string, so it's set from the file once the release exists. This
      # replaces the release page's text only: latest.json keeps the CHANGELOG section it was written with.
      - name: Add the release notes
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --notes-file .github/release-notes.md

      - name: Build without publishing
        if: github.event_name == 'workflow_dispatch'
        working-directory: tsundoku
        run: npm run tauri build

      - name: Keep the installer with the run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Tsundoku-${{ steps.version.outputs.version }}-setup
          path: tsundoku/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
