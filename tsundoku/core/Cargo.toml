[package]
name = "tsundoku-core"
description = "Tsundoku's logic, with no Tauri dependency."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# MEGA's files arrive encrypted (AES-128 in counter mode) with a CBC-MAC to check them by: hosts/mega.rs.
aes = "0.9"
base64 = "0.23"
ctr = "0.10"
dirs = "7"
# Gives a reader back an answer whose page was read to tell whether it's a check (hosts::checked).
http = "1"
md-5 = "0.11"
# Native TLS is Windows' own (SChannel): no crypto library to build, and Windows' certificate store.
# Rule conditions' patterns (rules.rs). Matching takes linear time, so no pattern can hang the app.
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }
rusqlite = { version = "0.41", features = ["bundled"] }
# 7z archives a download brings (unpack/sevenz.rs): LZMA, LZMA2, PPMd, bzip2, deflate, and AES for passwords.
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "bzip2", "deflate", "ppmd", "util"] }
serde.workspace = true
serde_json.workspace = true
# OneDrive gives each file's SHA-1, MediaFire its SHA-256, to check a download by (downloads/file_runner.rs).
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
ts-rs = "12.0.1"
# Rar archives (unpack/rar.rs), through UnRAR's own library built from its source. Its licence lets any software
# read rar archives with it, but not make them: README's credits carry it.
unrar_sys = "0.5.8"
which = "8"
# Tool downloads (tools/), and zip archives a download brings (unpack/zips.rs), with ZipCrypto's or AES's password.
zip = { version = "9", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "deflate64", "lzma", "ppmd", "xz"] }

# Job objects, so ending a program also ends everything it started (process.rs), the clipboard the clipboard
# watcher reads (clipboard.rs), the local time an automatic backup is named after (backup.rs), Windows' version for
# Copy Details (system.rs), and a drive's free space (room.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Making 7z archives for the unpacking tests.
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "compress", "util"] }
tempfile = "3"
