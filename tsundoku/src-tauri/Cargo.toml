[package]
name = "tsundoku"
description = "Downloads videos with yt-dlp and remembers what you already have."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name, which clash on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "tsundoku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tsundoku-core = { path = "../core" }
# generate_context! writes plugins' settings from tauri.conf.json as serde_json values.
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-window-state = "2.5.0"
window-vibrancy = "0.8.1"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-deep-link = "2.6.3"

# Windows' color picker, for Settings → Appearance's custom accent (appearance.rs): WebView2 doesn't open one for a
# color input.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs"] }
# The check window's downloads, through WebView2's own download operation (the versions wry uses).
webview2-com = "0.39"
windows = "0.62"
