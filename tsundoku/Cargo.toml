[workspace]
members = ["core", "src-tauri"]
resolver = "3"

# The version is bumped together with package.json, which tauri.conf.json reads (see AGENTS.md).
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Fuzen777"]
license = "MIT"
repository = "https://github.com/Fuzen777/Tsundoku"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
